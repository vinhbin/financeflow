<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinanceFlow - Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class = "container">
        <h2>FinanceFlow dashboard</h2>
        <section class="account-overview">
            <h3>Account Overview</h3>
            <p><strong>Income:</strong> $<span id="income">0</span></p>
            <p><strong>Expenses:</strong> $<span id="expenses">0</span></p>
            <p><strong>Balance:</strong> $<span id="balance">0</span></p>
        </section>
        <section class="budget">
            <h3>Budget</h3>
            <div id="budget"></div>
        </section>
        <section class="transactions">
            <h3>Transactions</h3>
            <table id="transactions">
                <tr>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Description</th>
                </tr>
            </table>
        </section>
        <section class="add-transaction">
            <h3>Add Transaction</h3>
            <form id="add-transaction-form">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" required>
                <label for="category">Category:</label>
                <input type="text" id="category" name="category" required>
                <label for="description">Description:</label>
                <input type="text" id="description" name="description" required>
                <button type="submit">Add Transaction</button>
            </form>
        </section>
        <button onclick="logout()">Logout</button>
    </div>
    <script>
        function logout() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
